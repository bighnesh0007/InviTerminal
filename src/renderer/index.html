<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  style-src allows 'unsafe-inline' only because xterm.js builds <style> elements at runtime
  (theme, cell metrics) and has no nonce support; without it the terminal loses colour and
  its monospace grid. Scripts stay 'self'-only, and with default-src 'none' inline CSS
  cannot load fonts, images or URLs from anywhere else.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' blob: mediastream:">
<title>InviTerminal</title>
<link rel="stylesheet" href="xterm.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<script src="main.js"></script>
</body>
</html>
